# Jekyll 站点配置
# 架构：内容源 → 同步脚本 → _posts/ → Jekyll → GitHub Pages
# 样式：自托管（assets/css/main.scss），参考 willmcgugan.github.io 排版

title: 余烬
description: 本分健康，认真努力。做对事情，知错即止。
url: "https://hong525-gh.github.io"
baseurl: "/hong525_blog"

# 插件列表
# jekyll-feed      : 生成 RSS / Atom feed
# jekyll-seo-tag   : 生成 SEO meta 标签（head.html 的 {% seo %}）
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# 站点显示配置
theme_config:
  date_format: "%Y-%m-%d" # 日期显示格式

# RSS 作者信息（jekyll-feed 使用）
author:
  name: Hong525

favicon: "logo.jpeg"
